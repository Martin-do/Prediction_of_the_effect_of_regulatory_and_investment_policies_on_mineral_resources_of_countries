<svg xmlns="http://www.w3.org/2000/svg" width="190mm" height="122.5mm" viewBox="0 0 1900 1225">
<rect x="0" y="0" width="1900" height="1225" fill="#FFFFFF"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#1F4E79"/></marker></defs>
<rect x="55" y="38" width="560" height="430" rx="24" fill="#F7F7F7" stroke="#7A7A7A" stroke-width="2.3"/>
<circle cx="107" cy="90" r="29" fill="#1F4E79"/>
<text x="107" y="100" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="107" dy="0">1</tspan>
</text>
<text x="153" y="85" font-family="Arial, Helvetica, sans-serif" font-size="31.5" font-weight="700" fill="#1F4E79" text-anchor="start">
<tspan x="153" dy="0">Candidate signals</tspan>
</text>
<line x1="81" y1="142" x2="589" y2="142" stroke="#7A7A7A" stroke-width="1.5"/>
<circle cx="93" cy="177" r="4.2" fill="#1F4E79"/>
<text x="111" y="184" font-family="Arial, Helvetica, sans-serif" font-size="25.2" font-weight="400" fill="#111111" text-anchor="start">
<tspan x="111" dy="0">Oil rents (t−1)</tspan>
</text>
<circle cx="93" cy="211.2" r="4.2" fill="#1F4E79"/>
<text x="111" y="218.2" font-family="Arial, Helvetica, sans-serif" font-size="25.2" font-weight="400" fill="#111111" text-anchor="start">
<tspan x="111" dy="0">Regulatory Quality estimate</tspan>
<tspan x="111" dy="29.2">(WGI 2025 Revision;</tspan>
<tspan x="111" dy="29.2">standard-unit scale, t−1)</tspan>
</text>
<circle cx="93" cy="303.79999999999995" r="4.2" fill="#1F4E79"/>
<text x="111" y="310.79999999999995" font-family="Arial, Helvetica, sans-serif" font-size="25.2" font-weight="400" fill="#111111" text-anchor="start">
<tspan x="111" dy="0">Trade excluded: wholly missing</tspan>
<tspan x="111" dy="29.2">for Nigeria and Trinidad and Tobago</tspan>
</text>
<rect x="670" y="38" width="560" height="430" rx="24" fill="#F1F3F5" stroke="#7A7A7A" stroke-width="2.3"/>
<circle cx="722" cy="90" r="29" fill="#1F4E79"/>
<text x="722" y="100" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="722" dy="0">2</tspan>
</text>
<text x="768" y="85" font-family="Arial, Helvetica, sans-serif" font-size="31.5" font-weight="700" fill="#1F4E79" text-anchor="start">
<tspan x="768" dy="0">Construct provenance</tspan>
<tspan x="768" dy="36">&amp; coverage audit</tspan>
</text>
<line x1="696" y1="150" x2="1204" y2="150" stroke="#7A7A7A" stroke-width="1.5"/>
<circle cx="708" cy="185" r="4.2" fill="#1F4E79"/>
<text x="726" y="192" font-family="Arial, Helvetica, sans-serif" font-size="25.2" font-weight="400" fill="#111111" text-anchor="start">
<tspan x="726" dy="0">Annual inward FDI net flow,</tspan>
<tspan x="726" dy="29.2">not inward FDI stock</tspan>
</text>
<circle cx="708" cy="248.4" r="4.2" fill="#1F4E79"/>
<text x="726" y="255.4" font-family="Arial, Helvetica, sans-serif" font-size="25.2" font-weight="400" fill="#111111" text-anchor="start">
<tspan x="726" dy="0">Signed asinh retains zero and</tspan>
<tspan x="726" dy="29.2">504 negative-flow years</tspan>
</text>
<circle cx="708" cy="311.8" r="4.2" fill="#1F4E79"/>
<text x="726" y="318.8" font-family="Arial, Helvetica, sans-serif" font-size="25.2" font-weight="400" fill="#111111" text-anchor="start">
<tspan x="726" dy="0">31 oil-rent-intensive economies</tspan>
<tspan x="726" dy="29.2">restored; Nigeria included</tspan>
</text>
<circle cx="708" cy="375.2" r="4.2" fill="#1F4E79"/>
<text x="726" y="382.2" font-family="Arial, Helvetica, sans-serif" font-size="25.2" font-weight="400" fill="#111111" text-anchor="start">
<tspan x="726" dy="0">RQ is a perception-based national</tspan>
<tspan x="726" dy="29.2">proxy; construct validity is not</tspan>
<tspan x="726" dy="29.2">established by this audit</tspan>
</text>
<rect x="1285" y="38" width="560" height="430" rx="24" fill="#F7F7F7" stroke="#7A7A7A" stroke-width="2.3"/>
<circle cx="1337" cy="90" r="29" fill="#1F4E79"/>
<text x="1337" y="100" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="1337" dy="0">3</tspan>
</text>
<text x="1383" y="85" font-family="Arial, Helvetica, sans-serif" font-size="31.5" font-weight="700" fill="#1F4E79" text-anchor="start">
<tspan x="1383" dy="0">Benchmark competitiveness</tspan>
</text>
<line x1="1311" y1="142" x2="1819" y2="142" stroke="#7A7A7A" stroke-width="1.5"/>
<circle cx="1323" cy="177" r="4.2" fill="#1F4E79"/>
<text x="1341" y="184" font-family="Arial, Helvetica, sans-serif" font-size="25.2" font-weight="400" fill="#111111" text-anchor="start">
<tspan x="1341" dy="0">Oil-rents test: M2 versus</tspan>
<tspan x="1341" dy="29.2">strongest naïve benchmark</tspan>
</text>
<circle cx="1323" cy="240.4" r="4.2" fill="#1F4E79"/>
<text x="1341" y="247.4" font-family="Arial, Helvetica, sans-serif" font-size="25.2" font-weight="400" fill="#111111" text-anchor="start">
<tspan x="1341" dy="0">RQ test: M3 versus</tspan>
<tspan x="1341" dy="29.2">strongest naïve benchmark</tspan>
</text>
<circle cx="1323" cy="303.8" r="4.2" fill="#1F4E79"/>
<text x="1341" y="310.8" font-family="Arial, Helvetica, sans-serif" font-size="25.2" font-weight="400" fill="#111111" text-anchor="start">
<tspan x="1341" dy="0">Benchmarks: zero flow,</tspan>
<tspan x="1341" dy="29.2">training-sample mean, lagged flow</tspan>
</text>
<circle cx="1323" cy="367.2" r="4.2" fill="#1F4E79"/>
<text x="1341" y="374.2" font-family="Arial, Helvetica, sans-serif" font-size="25.2" font-weight="400" fill="#111111" text-anchor="start">
<tspan x="1341" dy="0">Question: is the surrounding model</tspan>
<tspan x="1341" dy="29.2">useful out of sample?</tspan>
</text>
<rect x="55" y="515" width="560" height="430" rx="24" fill="#F1F3F5" stroke="#7A7A7A" stroke-width="2.3"/>
<circle cx="107" cy="567" r="29" fill="#1F4E79"/>
<text x="107" y="577" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="107" dy="0">4</tspan>
</text>
<text x="153" y="562" font-family="Arial, Helvetica, sans-serif" font-size="31.5" font-weight="700" fill="#1F4E79" text-anchor="start">
<tspan x="153" dy="0">Matched signal increment</tspan>
</text>
<line x1="81" y1="619" x2="589" y2="619" stroke="#7A7A7A" stroke-width="1.5"/>
<circle cx="93" cy="654" r="4.2" fill="#1F4E79"/>
<text x="111" y="661" font-family="Arial, Helvetica, sans-serif" font-size="25.2" font-weight="400" fill="#111111" text-anchor="start">
<tspan x="111" dy="0">Oil rents: ΔR² = R²(M2) − R²(M1)</tspan>
</text>
<circle cx="93" cy="688.2" r="4.2" fill="#1F4E79"/>
<text x="111" y="695.2" font-family="Arial, Helvetica, sans-serif" font-size="25.2" font-weight="400" fill="#111111" text-anchor="start">
<tspan x="111" dy="0">Regulatory Quality:</tspan>
<tspan x="111" dy="29.2">ΔR² = R²(M3) − R²(M2)</tspan>
</text>
<circle cx="93" cy="751.6" r="4.2" fill="#1F4E79"/>
<text x="111" y="758.6" font-family="Arial, Helvetica, sans-serif" font-size="25.2" font-weight="400" fill="#111111" text-anchor="start">
<tspan x="111" dy="0">Adjacent rungs evaluated on</tspan>
<tspan x="111" dy="29.2">identical country-year observations</tspan>
</text>
<circle cx="93" cy="815.0" r="4.2" fill="#1F4E79"/>
<text x="111" y="822.0" font-family="Arial, Helvetica, sans-serif" font-size="25.2" font-weight="400" fill="#111111" text-anchor="start">
<tspan x="111" dy="0">Question: what does the signal add</tspan>
<tspan x="111" dy="29.2">beyond the preceding model rung?</tspan>
</text>
<rect x="670" y="515" width="560" height="430" rx="24" fill="#F7F7F7" stroke="#7A7A7A" stroke-width="2.3"/>
<circle cx="722" cy="567" r="29" fill="#1F4E79"/>
<text x="722" y="577" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="722" dy="0">5</tspan>
</text>
<text x="768" y="562" font-family="Arial, Helvetica, sans-serif" font-size="31.5" font-weight="700" fill="#1F4E79" text-anchor="start">
<tspan x="768" dy="0">Validation &amp; uncertainty</tspan>
</text>
<line x1="696" y1="619" x2="1204" y2="619" stroke="#7A7A7A" stroke-width="1.5"/>
<circle cx="708" cy="654" r="4.2" fill="#1F4E79"/>
<text x="726" y="661" font-family="Arial, Helvetica, sans-serif" font-size="25.2" font-weight="400" fill="#111111" text-anchor="start">
<tspan x="726" dy="0">3 algorithms × 6 validation</tspan>
<tspan x="726" dy="29.2">environments = 18 units/setup</tspan>
</text>
<circle cx="708" cy="717.4" r="4.2" fill="#1F4E79"/>
<text x="726" y="724.4" font-family="Arial, Helvetica, sans-serif" font-size="25.2" font-weight="400" fill="#111111" text-anchor="start">
<tspan x="726" dy="0">1 pooled unseen-country unit</tspan>
<tspan x="726" dy="29.2">+ 5 future cutoffs</tspan>
</text>
<circle cx="708" cy="780.8" r="4.2" fill="#1F4E79"/>
<text x="726" y="787.8" font-family="Arial, Helvetica, sans-serif" font-size="25.2" font-weight="400" fill="#111111" text-anchor="start">
<tspan x="726" dy="0">2,000-replicate paired</tspan>
<tspan x="726" dy="29.2">country-cluster bootstrap</tspan>
</text>
<circle cx="708" cy="844.1999999999999" r="4.2" fill="#1F4E79"/>
<text x="726" y="851.1999999999999" font-family="Arial, Helvetica, sans-serif" font-size="25.2" font-weight="400" fill="#111111" text-anchor="start">
<tspan x="726" dy="0">Final grid fixed before verdict</tspan>
<tspan x="726" dy="29.2">generation and interpretation</tspan>
</text>
<rect x="1285" y="515" width="560" height="430" rx="24" fill="#F1F3F5" stroke="#7A7A7A" stroke-width="2.3"/>
<circle cx="1337" cy="567" r="29" fill="#1F4E79"/>
<text x="1337" y="577" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="1337" dy="0">6</tspan>
</text>
<text x="1383" y="562" font-family="Arial, Helvetica, sans-serif" font-size="31.5" font-weight="700" fill="#1F4E79" text-anchor="start">
<tspan x="1383" dy="0">Admissibility decision</tspan>
</text>
<line x1="1311" y1="619" x2="1819" y2="619" stroke="#7A7A7A" stroke-width="1.5"/>
<circle cx="1323" cy="654" r="4.2" fill="#1F4E79"/>
<text x="1341" y="661" font-family="Arial, Helvetica, sans-serif" font-size="25.2" font-weight="400" fill="#111111" text-anchor="start">
<tspan x="1341" dy="0">Five unit verdicts: material,</tspan>
<tspan x="1341" dy="29.2">marginal, setup-dependent,</tspan>
<tspan x="1341" dy="29.2">unsupported, coverage-limited</tspan>
</text>
<circle cx="1323" cy="746.6" r="4.2" fill="#1F4E79"/>
<text x="1341" y="753.6" font-family="Arial, Helvetica, sans-serif" font-size="25.2" font-weight="400" fill="#111111" text-anchor="start">
<tspan x="1341" dy="0">10 setups per signal aggregated</tspan>
<tspan x="1341" dy="29.2">by locked cross-setup rules</tspan>
</text>
<circle cx="1323" cy="810.0" r="4.2" fill="#1F4E79"/>
<text x="1341" y="817.0" font-family="Arial, Helvetica, sans-serif" font-size="25.2" font-weight="400" fill="#111111" text-anchor="start">
<tspan x="1341" dy="0">Output: candidate pre-weighting</tspan>
<tspan x="1341" dy="29.2">role; no AI–MCDM weights assigned</tspan>
</text>
<circle cx="1323" cy="873.4" r="4.2" fill="#1F4E79"/>
<text x="1341" y="880.4" font-family="Arial, Helvetica, sans-serif" font-size="25.2" font-weight="400" fill="#111111" text-anchor="start">
<tspan x="1341" dy="0">Domain review and preference</tspan>
<tspan x="1341" dy="29.2">elicitation follow only after admission</tspan>
</text>
<line x1="615" y1="253.0" x2="658" y2="253.0" stroke="#1F4E79" stroke-width="3.2" marker-end="url(#arrow)"/>
<line x1="1230" y1="253.0" x2="1273" y2="253.0" stroke="#1F4E79" stroke-width="3.2" marker-end="url(#arrow)"/>
<line x1="615" y1="730.0" x2="658" y2="730.0" stroke="#1F4E79" stroke-width="3.2" marker-end="url(#arrow)"/>
<line x1="1230" y1="730.0" x2="1273" y2="730.0" stroke="#1F4E79" stroke-width="3.2" marker-end="url(#arrow)"/>
<path d="M 1827,325.0 L 1873,325.0 L 1873,491 L 27,491 L 27,730.0 L 51,730.0" fill="none" stroke="#1F4E79" stroke-width="3.2" marker-end="url(#arrow)"/>
<rect x="55" y="985" width="1790" height="205" rx="24" fill="#EAF1F7" stroke="#1F4E79" stroke-width="2.3"/>
<text x="89" y="1024" font-family="Arial, Helvetica, sans-serif" font-size="31.5" font-weight="700" fill="#1F4E79" text-anchor="start">
<tspan x="89" dy="0">Audit principles</tspan>
</text>
<circle cx="107" cy="1076" r="20" fill="#1F4E79"/>
<text x="107" y="1085" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="107" dy="0">1</tspan>
</text>
<text x="141" y="1066" font-family="Arial, Helvetica, sans-serif" font-size="25.2" font-weight="400" fill="#111111" text-anchor="start">
<tspan x="141" dy="0">Benchmark competitiveness is</tspan>
<tspan x="141" dy="29.2">necessary but insufficient for</tspan>
<tspan x="141" dy="29.2">signal admissibility.</tspan>
</text>
<circle cx="685" cy="1076" r="20" fill="#1F4E79"/>
<text x="685" y="1085" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="685" dy="0">2</tspan>
</text>
<text x="719" y="1066" font-family="Arial, Helvetica, sans-serif" font-size="25.2" font-weight="400" fill="#111111" text-anchor="start">
<tspan x="719" dy="0">Admissibility belongs to a</tspan>
<tspan x="719" dy="29.2">signal within a defensible setup;</tspan>
<tspan x="719" dy="29.2">it is not intrinsic to the variable.</tspan>
</text>
<circle cx="1263" cy="1076" r="20" fill="#1F4E79"/>
<text x="1263" y="1085" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#FFFFFF" text-anchor="middle">
<tspan x="1263" dy="0">3</tspan>
</text>
<text x="1297" y="1066" font-family="Arial, Helvetica, sans-serif" font-size="25.2" font-weight="400" fill="#111111" text-anchor="start">
<tspan x="1297" dy="0">Weighting follows empirical</tspan>
<tspan x="1297" dy="29.2">admission and domain review;</tspan>
<tspan x="1297" dy="29.2">weighting cannot repair a weak signal.</tspan>
</text>
</svg>